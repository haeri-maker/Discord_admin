<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#1c1c1e; --bg2:#2c2c2e; --bg3:#3a3a3c; --bg4:#48484a;
  --surface:#2c2c2e; --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.12);
  --text:#f5f5f7; --text2:#aeaeb2; --text3:#6c6c70;
  --accent:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2;
  --r:12px; --r-lg:16px; --font:"Geist",-apple-system,sans-serif; --mono:"Geist Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px;}
a{text-decoration:none;}

/* LAYOUT */
.wrap{display:flex;min-height:100vh;}
.sidebar{width:220px;background:rgba(28,28,30,0.97);border-right:0.5px solid var(--border);display:flex;flex-direction:column;padding:20px 0;position:fixed;top:0;left:0;bottom:0;z-index:10;overflow-y:auto;}
.main{margin-left:220px;flex:1;padding:24px 28px;overflow-y:auto;}
.page{display:none;}.page.active{display:block;}

/* SIDEBAR */
.logo{padding:0 16px 20px;border-bottom:0.5px solid var(--border);margin-bottom:6px;}
.logo-name{font-size:14px;font-weight:600;letter-spacing:-0.3px;}
.logo-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.nav-sec{padding:12px 16px 4px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:13px;color:var(--text2);cursor:pointer;border-radius:8px;margin:1px 8px;transition:all 0.15s;position:relative;}
.nav-item:hover{color:var(--text);background:var(--bg3);}
.nav-item.active{color:var(--text);background:var(--bg3);font-weight:500;}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--accent);border-radius:0 2px 2px 0;margin-left:-8px;}
.nav-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.ni-blue{background:rgba(10,132,255,0.15);}
.ni-green{background:rgba(48,209,88,0.15);}
.ni-purple{background:rgba(191,90,242,0.15);}
.ni-orange{background:rgba(255,159,10,0.15);}

/* PAGE HEADER */
.ph{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.pt{font-size:22px;font-weight:600;letter-spacing:-0.5px;}
.ps{font-size:12px;color:var(--text3);margin-top:3px;}

/* BRANCH FILTER */
.bf{display:flex;gap:5px;background:var(--bg2);padding:3px;border-radius:10px;border:0.5px solid var(--border);}
.bb{padding:5px 13px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text3);transition:all 0.15s;font-family:var(--font);}
.bb.active{background:var(--bg4);color:var(--text);}

/* CARDS */
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-ttl{font-size:13px;font-weight:600;}

/* DASHBOARD LAYOUT */
.dash-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
.ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* CHANNEL CARD */
.ch-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:18px;cursor:pointer;transition:all 0.2s;}
.ch-card:hover{border-color:var(--accent);background:var(--bg3);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.ch-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px;}
.ch-name{font-size:13px;font-weight:600;margin-bottom:8px;}
.ch-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border);}
.csl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px;}
.csv{font-size:20px;font-weight:600;font-family:var(--mono);}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-ttl{font-size:14px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:0.5px solid var(--border);border-radius:10px;overflow:hidden;}
.cal-dow{background:var(--bg2);padding:7px 0;text-align:center;font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;}
.cal-day{background:var(--surface);min-height:80px;padding:5px;position:relative;transition:background 0.15s;}
.cal-day:hover{background:var(--bg3);}
.cal-day.other-month .cal-dn{color:var(--text3);}
.cal-day.today .cal-dn{background:var(--accent);color:#fff;border-radius:50%;}
.cal-dn{font-size:11px;font-weight:500;width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin-bottom:3px;}
.cal-ev{font-size:9px;padding:1px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}

/* CAMPAIGN ITEMS */
.ci{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:10px;transition:border-color 0.15s;}
.ci:hover{border-color:var(--border2);}
.ci-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:12px;}
.ci-title{font-size:15px;font-weight:600;letter-spacing:-0.3px;}
.ci-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.ci-desc{font-size:12px;color:var(--text);padding:9px 12px;background:var(--bg);border-radius:8px;line-height:1.6;margin-bottom:8px;}
.ci-desc-lbl{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;margin-bottom:3px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;padding:12px;background:var(--bg);border-radius:9px;border:0.5px solid var(--border);}
.stat-box{text-align:center;}
.sl{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:3px;font-weight:500;}
.sv{font-size:19px;font-weight:600;font-family:var(--mono);}
.url-box{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 20px;background:linear-gradient(135deg,rgba(48,209,88,0.12),rgba(48,209,88,0.06));border-radius:12px;margin-top:10px;border:1px solid rgba(48,209,88,0.25);cursor:pointer;transition:all 0.2s;text-decoration:none;}
.url-box:hover{background:linear-gradient(135deg,rgba(48,209,88,0.22),rgba(48,209,88,0.12));border-color:rgba(48,209,88,0.5);transform:translateY(-1px);}
.url-lbl{font-size:13px;color:#30d158;font-weight:700;letter-spacing:0.3px;}
.url-txt{font-size:11px;color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);}

/* MONTH SECTION */
.month-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;margin-top:4px;}
.month-lbl{font-size:13px;font-weight:600;}
.month-badge{font-size:10px;padding:2px 8px;border-radius:99px;}
.cur-badge{background:rgba(10,132,255,0.15);color:#4cb8ff;font-weight:600;}
.arc-badge{background:var(--bg3);color:var(--text3);}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500;}
.b-blue{background:rgba(10,132,255,0.15);color:#4cb8ff;}
.b-green{background:rgba(48,209,88,0.15);color:#30d158;}
.b-orange{background:rgba(255,159,10,0.15);color:#ff9f0a;}
.b-gray{background:var(--bg3);color:var(--text2);}

/* BUTTONS */
.btn{font-family:var(--font);font-size:12px;padding:7px 14px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{background:var(--bg4);color:var(--text);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500;}
.btn.primary:hover{background:#0071e3;}
.btn.green{background:rgba(48,209,88,0.15);color:var(--green);border-color:rgba(48,209,88,0.2);font-weight:500;}
.btn.green:hover{background:rgba(48,209,88,0.25);}
.btn.danger{color:var(--red);border-color:rgba(255,69,58,0.2);}
.btn.danger:hover{background:rgba(255,69,58,0.1);}

/* FORM */
input,textarea,select{font-family:var(--font);font-size:13px;padding:9px 12px;border-radius:9px;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text);outline:none;width:100%;transition:border 0.15s;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
input::placeholder,textarea::placeholder{color:var(--text3);}
textarea{resize:vertical;min-height:64px;line-height:1.5;}
select option{background:var(--bg3);}
label{font-size:11px;color:var(--text3);display:block;margin-bottom:5px;font-weight:500;}
.fg{margin-bottom:12px;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
hr.div{border:none;border-top:0.5px solid var(--border);margin:14px 0;}

/* MODAL */
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);z-index:1000;align-items:center;justify-content:center;overflow-y:auto;padding:20px;backdrop-filter:blur(4px);}
.overlay.open{display:flex;}
.modal{background:var(--surface);border:0.5px solid var(--border2);border-radius:20px;padding:24px;width:100%;max-width:540px;margin:auto;max-height:90vh;display:flex;flex-direction:column;}
#modal-body{overflow-y:auto;flex:1;}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-ttl{font-size:16px;font-weight:600;}
.modal-ft{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:0.5px solid var(--border);}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--text3);}

/* DATE PICKER */
.dp-wrap{position:relative;}
.dp-input{cursor:pointer;background:var(--bg3);border:0.5px solid var(--border2);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--font);width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;}
.dp-input:hover{border-color:var(--accent);}
.dp-cal{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:500;background:var(--bg2);border:0.5px solid var(--border2);border-radius:14px;padding:14px;width:260px;box-shadow:0 16px 40px rgba(0,0,0,0.5);}
.dp-cal.open{display:block;}
.dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.dp-title{font-size:13px;font-weight:600;}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.dp-dow{text-align:center;font-size:10px;color:var(--text3);font-weight:600;padding:4px 0;}
.dp-day{text-align:center;font-size:12px;padding:6px 0;border-radius:6px;cursor:pointer;color:var(--text2);transition:all 0.1s;}
.dp-day:hover{background:var(--bg3);color:var(--text);}
.dp-day.today{color:var(--accent);font-weight:600;}
.dp-day.selected{background:var(--accent);color:#fff;font-weight:600;}
.dp-day.in-range{background:rgba(10,132,255,0.15);color:var(--text);}
.dp-day.other{color:var(--text3);}
.dp-day.disabled{opacity:0.3;cursor:default;}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:0.4;}

/* LOADING BAR */
#lbar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--green));z-index:9999;opacity:0;transition:opacity 0.3s;}
</style>
</head>
<body>
<div id="lbar"></div>
<div class="wrap">

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="logo">
    <div class="logo-name">Content Admin</div>
    <div class="logo-sub">Campaign Dashboard</div>
  </div>
  <div class="nav-sec">Overview</div>
  <div class="nav-item active" id="nav-overview" onclick="showPage('overview')">
    <div class="nav-icon ni-blue">📊</div>Dashboard
  </div>
  <div class="nav-sec">Channels</div>
  <div class="nav-item" id="nav-discord" onclick="showPage('discord')">
    <div class="nav-icon ni-blue">🎮</div>Discord
  </div>
  <div class="nav-item" id="nav-nurilounge" onclick="showPage('nurilounge')">
    <div class="nav-icon ni-green">🍵</div>Nurilounge Campaign
  </div>
  <div class="nav-item" id="nav-roster" onclick="showPage('roster')">
    <div class="nav-icon ni-purple">📋</div>Nurilounge Roster
  </div>
  <div class="nav-item" id="nav-ugc" onclick="showPage('ugc')">
    <div class="nav-icon ni-orange">🎬</div>UGC
  </div>
</nav>

<!-- MAIN -->
<main class="main">

<!-- DASHBOARD -->
<div class="page active" id="page-overview">
  <div class="ph">
    <div style="display:flex;align-items:center;gap:12px">
      <div><div class="pt">Dashboard</div><div class="ps">전체 캠페인 현황</div></div>
      <div style="display:flex;align-items:center;gap:6px;background:var(--bg2);padding:4px 8px;border-radius:10px;border:0.5px solid var(--border)">
        <button class="btn" onclick="dashPrev()" style="padding:3px 9px;font-size:13px">‹</button>
        <span id="dash-month-label" style="font-size:13px;font-weight:600;min-width:90px;text-align:center"></span>
        <button class="btn" onclick="dashNext()" style="padding:3px 9px;font-size:13px">›</button>
      </div>
    </div>
    <div class="bf">
      <button class="bb active" onclick="setBranch('all',this)">All</button>
      <button class="bb" onclick="setBranch('Global',this)">Global</button>
      <button class="bb" onclick="setBranch('US',this)">US</button>
      <button class="bb" onclick="setBranch('KR',this)">KR</button>
    </div>
  </div>
  <div class="dash-layout">
    <div class="ch-grid" id="ch-grid">
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text3);font-size:13px">⏳ 로딩 중...</div>
    </div>
    <div class="card" style="margin-bottom:0">
      <div class="cal-nav">
        <div class="cal-ttl" id="ov-cal-title"></div>
        <div style="display:flex;gap:5px">
          <button class="btn" onclick="ocPrev()" style="padding:4px 10px">‹</button>
          <button class="btn" onclick="ocNext()" style="padding:4px 10px">›</button>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <span style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:2px;background:#4cb8ff;display:inline-block"></span>Discord</span>
        <span style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:2px;background:#30d158;display:inline-block"></span>Nurilounge</span>
        <span style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:2px;background:#bf5af2;display:inline-block"></span>Roster</span>
        <span style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:2px;background:#ff9f0a;display:inline-block"></span>UGC</span>
      </div>
      <div class="cal-grid" id="ov-cal-grid">
        <div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div>
        <div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow">토</div>
      </div>
    </div>
  </div>
</div>

<!-- DISCORD -->
<div class="page" id="page-discord">
  <div class="ph">
    <div><div class="pt">Discord</div><div class="ps">챌린지 캠페인 관리</div></div>
    <button class="btn primary" onclick="openModal('discord')">＋ 캠페인 추가</button>
  </div>
  <div id="discord-list"></div>
</div>

<!-- NURILOUNGE -->
<div class="page" id="page-nurilounge">
  <div class="ph">
    <div><div class="pt">Nurilounge Campaign</div><div class="ps">누리라운지 캠페인 관리</div></div>
    <button class="btn primary" onclick="openModal('nurilounge')">＋ 캠페인 추가</button>
  </div>
  <div id="nurilounge-list"></div>
</div>

<!-- ROSTER -->
<div class="page" id="page-roster">
  <div class="ph">
    <div><div class="pt">Nurilounge Roster</div><div class="ps">로스터 관리</div></div>
    <button class="btn primary" onclick="openModal('roster')">＋ 캠페인 추가</button>
  </div>
  <div id="roster-list"></div>
</div>

<!-- UGC -->
<div class="page" id="page-ugc">
  <div class="ph">
    <div><div class="pt">UGC</div><div class="ps">UGC 캠페인 관리</div></div>
    <button class="btn primary" onclick="openModal('ugc')">＋ 캠페인 추가</button>
  </div>
  <div id="ugc-list"></div>
</div>

</main>
</div>

<!-- NOTE MODAL -->
<div class="overlay" id="note-overlay">
  <div class="modal" style="max-width:360px">
    <div class="modal-hd">
      <div class="modal-ttl" id="note-date-ttl">메모</div>
      <button class="btn" onclick="closeNoteModal()" style="padding:5px 10px">✕</button>
    </div>
    <div id="note-list" style="margin-bottom:12px;display:flex;flex-direction:column;gap:6px"></div>
    <div style="display:flex;gap:8px">
      <input type="text" id="note-emoji" value="🔴" style="width:52px;text-align:center;font-size:16px;padding:8px;flex-shrink:0">
      <input type="text" id="note-text" placeholder="메모 입력..." style="flex:1" onkeydown="if(event.key==='Enter')saveNote()">
      <button class="btn primary" onclick="saveNote()" style="flex-shrink:0">추가</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-ttl" id="modal-ttl">캠페인 추가</div>
      <button class="btn" onclick="closeModal()" style="padding:5px 10px">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-ft">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="saveCampaign()">저장</button>
    </div>
  </div>
</div>

<script>
// --- DATE PICKER ---
let dpState = {}; // {id, year, month, value, onChange}

function initDatePicker(id, initialVal, onChange) {
  const now = new Date();
  const d = initialVal ? new Date(initialVal.length===7?initialVal+'-01':initialVal) : now;
  dpState[id] = {year:isNaN(d)?now.getFullYear():d.getFullYear(), month:isNaN(d)?now.getMonth():d.getMonth(), value:initialVal||null, onChange};
  renderDP(id);
}

function renderDP(id) {
  const s = dpState[id]; if(!s) return;
  const el = document.getElementById('dp-cal-'+id); if(!el) return;
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today = new Date();
  const first = new Date(s.year,s.month,1).getDay();
  const last = new Date(s.year,s.month+1,0).getDate();
  const prev = new Date(s.year,s.month,0).getDate();
  // range info
  const startVal = dpState['f-start']?.value, endVal = dpState['f-end']?.value;
  const rangeStart = startVal ? new Date(startVal.length===7?startVal+'-01':startVal) : null;
  const rangeEnd = endVal ? new Date(endVal.length===7?endVal+'-28':endVal) : null;
  // 현재 모달의 채널색
  const dpChCol = editCh ? CH_INFO[editCh]?.col : '#0a84ff';

  let days = '';
  for(let i=0;i<first;i++) days+=`<div class="dp-day other">${prev-first+1+i}</div>`;
  for(let d=1;d<=last;d++) {
    const dt = new Date(s.year,s.month,d);
    const isToday = today.getFullYear()===s.year&&today.getMonth()===s.month&&today.getDate()===d;
    const dStr = s.year+'-'+String(s.month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isSel = s.value && (s.value===dStr || (s.value.length===7&&s.value===dStr.slice(0,7)));
    const isStart = startVal && startVal===dStr;
    const isEnd = endVal && endVal===dStr;
    const inRange = rangeStart&&rangeEnd&&dt>rangeStart&&dt<rangeEnd;
    let cls = 'dp-day';
    if(isToday) cls+=' today';
    let inlineStyle = '';
    if(isSel||isStart||isEnd) {
      inlineStyle = `background:${dpChCol};color:#fff;font-weight:600;`;
    } else if(inRange) {
      inlineStyle = `background:${dpChCol}28;color:var(--text);`;
    }
    days+=`<div class="${cls}" style="${inlineStyle}" onclick="selectDP('${id}','${dStr}')">${d}</div>`;
  }
  const rem=(7-((first+last)%7))%7;
  for(let d=1;d<=rem;d++) days+=`<div class="dp-day other">${d}</div>`;

  el.innerHTML = `
    <div class="dp-nav">
      <button class="btn" onclick="dpPrev('${id}')" style="padding:3px 8px;font-size:12px">‹</button>
      <span class="dp-title">${MN[s.month]} ${s.year}</span>
      <button class="btn" onclick="dpNext('${id}')" style="padding:3px 8px;font-size:12px">›</button>
    </div>
    <div class="dp-grid">
      <div class="dp-dow">일</div><div class="dp-dow">월</div><div class="dp-dow">화</div>
      <div class="dp-dow">수</div><div class="dp-dow">목</div><div class="dp-dow">금</div><div class="dp-dow">토</div>
      ${days}
    </div>`;
}

// --- UTILS ---
function curMonth(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'); }
function campMonth(c){
  // 시작일 기준 월 반환 (그룹화/아카이브용)
  const ref = c.start;
  if(!ref) return null;
  const d = new Date(ref.length===7?ref+'-01':ref);
  if(isNaN(d)) return null;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function campEndMonth(c){
  // 종료일 기준 — 수급 콘텐츠 집계용
  const ref = c.end || c.start;
  if(!ref) return null;
  const d = new Date(ref.length===7?ref+'-28':ref);
  if(isNaN(d)) return null;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function campActiveInMonth(c, ym){
  // 해당 월(YYYY-MM)이 캠페인 기간 안에 포함되는지
  if(!c.start) return false;
  const [y,m] = ym.split('-').map(Number);
  const monthStart = new Date(y, m-1, 1);
  const monthEnd = new Date(y, m, 0, 23, 59, 59);
  const s = new Date(c.start.length===7?c.start+'-01':c.start);
  const e = c.end ? new Date(c.end.length===7?c.end+'-28':c.end) : s;
  return s <= monthEnd && e >= monthStart;
}
function monthLabel(m){
  if(!m||m==='날짜 없음') return '날짜 없음';
  const [y,mo]=m.split('-');
  const ns=['','1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  return y+'년 '+ns[parseInt(mo)];
}
function bbadge(b){
  if(!b) return '';
  const cls=b==='Global'?'b-blue':b==='US'?'b-green':'b-orange';
  return `<span class="badge ${cls}">${b}</span>`;
}

function ocPrev(){ ocM--; if(ocM<0){ocM=11;ocY--;} renderOvCal(); }
function ocNext(){ ocM++; if(ocM>11){ocM=0;ocY++;} renderOvCal(); }
function renderOvCal(){
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('ov-cal-title').textContent = MN[ocM]+' '+ocY;
  const today = new Date();
  const first = new Date(ocY,ocM,1).getDay();
  const last = new Date(ocY,ocM+1,0).getDate();
  const prev = new Date(ocY,ocM,0).getDate();

  // 채널 고정 순서 & 색
  const CH_ORDER = ['discord','nurilounge','roster','ugc'];
  const chCol = {discord:'#4cb8ff',nurilounge:'#30d158',roster:'#bf5af2',ugc:'#ff9f0a'};

  // 캠페인 날짜 파싱
  const camps = {};
  CH_ORDER.forEach(ch=>{
    camps[ch] = (data[ch]||[]).map(c=>{
      if(!c.start||!c.end) return null;
      const s=new Date(c.start.length===7?c.start+'-01':c.start);
      const e=new Date(c.end.length===7?c.end+'-28':c.end);
      return (!isNaN(s)&&!isNaN(e))?{name:c.name,s,e}:null;
    }).filter(Boolean);
  });

  // 날짜별로 각 채널의 상태 계산 (none/start/mid/end)
  function dayState(ch, dt) {
    for(const c of camps[ch]) {
      const s = new Date(c.s); s.setHours(0,0,0,0);
      const e = new Date(c.e); e.setHours(23,59,59,999);
      const d = new Date(dt); d.setHours(12,0,0,0);
      if(d>=s && d<=e) {
        const isStart = d.toDateString()===c.s.toDateString();
        const isEnd = d.toDateString()===c.e.toDateString();
        return isStart&&isEnd?'single':isStart?'start':isEnd?'end':'mid';
      }
    }
    return 'none';
  }

  let cells='';
  // 이전 달 빈칸
  for(let i=0;i<first;i++) {
    cells+=`<div class="cal-day other-month"><div class="cal-dn">${prev-first+1+i}</div></div>`;
  }

  for(let d=1;d<=last;d++){
    const dt=new Date(ocY,ocM,d);
    const isTd=today.getFullYear()===ocY&&today.getMonth()===ocM&&today.getDate()===d;

    // 4개 채널 행
    const bars = CH_ORDER.map(ch=>{
      const st = dayState(ch, dt);
      if(st==='none') return `<div style="height:6px;margin-bottom:2px"></div>`;
      const col = chCol[ch];
      const rL = st==='start'||st==='single'?'3px':'0';
      const rR = st==='end'||st==='single'?'3px':'0';
      const mL = st==='start'||st==='single'?'2px':'0';
      const mR = st==='end'||st==='single'?'2px':'0';
      return `<div style="height:6px;margin-bottom:2px;background:${col};border-radius:${rL} ${rR} ${rR} ${rL};margin-left:${mL};margin-right:${mR};opacity:0.85" title="${ch}"></div>`;
    }).join('');

    const dStr=ocY+'-'+String(ocM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayNotes=data.notes[dStr]||[];
    const noteHTML=dayNotes.slice(0,2).map(n=>`<div style="font-size:9px;line-height:1.3;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px">${n.emoji} ${n.text}</div>`).join('');
    const moreNotes=dayNotes.length>2?`<div style="font-size:8px;color:var(--text3);padding:0 2px">+${dayNotes.length-2}</div>`:'';
    cells+=`<div class="cal-day${isTd?' today':''}" onclick="openNoteModal('${dStr}')" style="cursor:pointer">
      <div class="cal-dn">${d}</div>
      ${bars}
      ${noteHTML}${moreNotes}
    </div>`;
  }

  const rem=(7-((first+last)%7))%7;
  for(let d=1;d<=rem;d++) cells+=`<div class="cal-day other-month"><div class="cal-dn">${d}</div></div>`;

  const grid=document.getElementById('ov-cal-grid');
  const dows=Array.from(grid.children).filter(el=>el.classList.contains('cal-dow'));
  grid.innerHTML='';
  dows.forEach(h=>grid.appendChild(h));
  grid.insertAdjacentHTML('beforeend',cells);
}

  const isD=ch==='discord', isU=ch==='ugc', isR=ch==='nurilounge'||ch==='roster';
  const cm = curMonth();
  // 월별 그룹화
  const grp={};
  all.forEach((c,i)=>{
    const m=campMonth(c)||'날짜 없음';
    if(!grp[m]) grp[m]=[];
    grp[m].push({...c,_i:i});
  });
  const months=Object.keys(grp).sort((a,b)=>b.localeCompare(a));
  container.innerHTML=months.map(m=>{
    const camps=grp[m], isCur=m===cm;
    const today=new Date(); today.setHours(0,0,0,0);
    function isActive(c){
      const ref=c.end||c.start;
      if(!ref) return true;
      const e=new Date(ref.length===7?ref+'-28':ref);
      return e>=today;
    }
    const html=camps.map(c=>{
      const i=c._i;
      const a=parseInt(c.applicants)||0,cmp=parseInt(c.completed)||0,sub=parseInt(c.submitted)||0,dr=parseInt(c.dropped)||0,pd=parseInt(c.paid)||0;
      const stats=isD?
        `<div class="stats-row">
          <div class="stat-box"><div class="sl">신청자</div><div class="sv" style="color:#4cb8ff">${a}</div></div>
          <div class="stat-box"><div class="sl">제출자</div><div class="sv" style="color:#30d158">${sub}</div></div>
          <div class="stat-box"><div class="sl">미제출</div><div class="sv" style="color:#ff453a">${Math.max(0,a-sub)}</div></div>
          <div class="stat-box"><div class="sl">제출률</div><div class="sv" style="color:#ff9f0a">${a>0?Math.round(sub/a*100):0}%</div></div>
        </div>`:isU?
        `<div class="stats-row">
          <div class="stat-box"><div class="sl">신청자</div><div class="sv" style="color:#4cb8ff">${a}</div></div>
          <div class="stat-box"><div class="sl">수급완료</div><div class="sv" style="color:#30d158">${cmp}</div></div>
          <div class="stat-box"><div class="sl">Paid</div><div class="sv" style="color:#ff9f0a">${pd}</div></div>
          <div class="stat-box"><div class="sl">드롭</div><div class="sv" style="color:#ff453a">${dr}</div></div>
        </div>`:
        `<div class="stats-row">
          <div class="stat-box"><div class="sl">신청자</div><div class="sv" style="color:#4cb8ff">${a}</div></div>
          <div class="stat-box"><div class="sl">완료</div><div class="sv" style="color:#30d158">${cmp}</div></div>
          <div class="stat-box"><div class="sl">드롭</div><div class="sv" style="color:#ff453a">${dr}</div></div>
          <div class="stat-box"><div class="sl">완료율</div><div class="sv" style="color:#ff9f0a">${a>0?Math.round(cmp/a*100):0}%</div></div>
        </div>`;
      return `<div class="ci" style="${isActive(c)?'':'opacity:0.5'}">
        <div class="ci-hd">
          <div style="flex:1;min-width:0">
            <div class="ci-title">${c.name||'(이름 없음)'}</div>
            <div class="ci-meta">
              ${bbadge(c.branch)}
              ${c.start&&c.end?`<span class="badge b-gray">📅 ${c.start} ~ ${c.end}</span>`:''}
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <button onclick="openModal('${ch}',${i})" class="btn" style="font-size:11px;padding:5px 11px">수정</button>
            <button onclick="delCamp('${ch}',${i})" class="btn danger" style="font-size:11px;padding:5px 11px">삭제</button>
          </div>
        </div>
        ${c.purpose?`<div class="ci-desc"><div class="ci-desc-lbl">오픈 목적</div>${c.purpose}</div>`:''}
        ${c.product?`<div class="ci-desc"><div class="ci-desc-lbl">발송 제품</div>${c.product}</div>`:''}
        ${stats}
        ${(()=>{
          const allUrls = [...(c.urls||[])];
          if(isR&&c.reportUrl) allUrls.push({label:'Report',url:c.reportUrl});
          if(!allUrls.length&&c.folderUrl) allUrls.push({label:'폴더',url:c.folderUrl});
          return allUrls.map(u=>`<a href="${u.url}" target="_blank" class="url-box" onclick="event.stopPropagation()" style="margin-bottom:6px">
            <span style="font-size:18px">${u.label==='Report'?'📄':u.label.includes('시트')||u.label.includes('sheet')?'📊':'📁'}</span>
            <span class="url-lbl">${u.label||'링크'}</span>
            <span style="font-size:16px;color:#30d158">→</span>
          </a>`).join('');
        })()}
        ${c.memo?`<div style="font-size:12px;color:var(--text2);margin-top:8px">💬 ${c.memo}</div>`:''}
      </div>`;
    }).join('');
    return `<div style="margin-bottom:26px">
      <div class="month-hd">
        <span class="month-lbl" style="color:${isCur?'var(--text)':'var(--text3)'}">${monthLabel(m)}</span>
        <span class="month-badge ${isCur?'cur-badge':'arc-badge'}">${isCur?'이번 달':'지난 달'}</span>
        <span class="month-badge arc-badge">${camps.length}개</span>
      </div>
      ${html}
    </div>`;
  }).join('');
}

// --- MODAL ---
function getFields(ch,c={}){
  const isD=ch==='discord',isU=ch==='ugc',isR=ch==='nurilounge'||ch==='roster';
  const sf=isD?`
    <div class="fr">
      <div class="fg"><label>신청자 수</label><input type="number" id="f-applicants" value="${c.applicants||''}" min="0"></div>
      <div class="fg"><label>제출자 수</label><input type="number" id="f-submitted" value="${c.submitted||''}" min="0"></div>
    </div>`:isU?`
    <div class="fr">
      <div class="fg"><label>신청자 수</label><input type="number" id="f-applicants" value="${c.applicants||''}" min="0"></div>
      <div class="fg"><label>수급 완료</label><input type="number" id="f-completed" value="${c.completed||''}" min="0"></div>
    </div>
    <div class="fr">
      <div class="fg"><label>Paid</label><input type="number" id="f-paid" value="${c.paid||''}" min="0"></div>
      <div class="fg"><label>드롭</label><input type="number" id="f-dropped" value="${c.dropped||''}" min="0"></div>
    </div>`:`
    <div class="fr">
      <div class="fg"><label>신청자 수</label><input type="number" id="f-applicants" value="${c.applicants||''}" min="0"></div>
      <div class="fg"><label>완료</label><input type="number" id="f-completed" value="${c.completed||''}" min="0"></div>
    </div>
    <div class="fr">
      <div class="fg"><label>드롭</label><input type="number" id="f-dropped" value="${c.dropped||''}" min="0"></div>
      <div class="fg"></div>
    </div>`;
  return `
    <div class="fr">
      <div class="fg"><label>캠페인명 *</label><input type="text" id="f-name" value="${c.name||''}" placeholder="예: Challenge #1"></div>
      <div class="fg"><label>브랜치</label>
        <select id="f-branch">
          <option value="">선택</option>
          <option value="Global" ${c.branch==='Global'?'selected':''}>Global</option>
          <option value="US" ${c.branch==='US'?'selected':''}>US</option>
          <option value="KR" ${c.branch==='KR'?'selected':''}>KR</option>
        </select>
      </div>
    </div>
    <div class="fr">
      ${dpField('f-start','시작일','날짜 선택',c.start||'')}
      ${dpField('f-end','종료일','날짜 선택',c.end||'')}
    </div>
    <div class="fg"><label>오픈 목적</label><textarea id="f-purpose" placeholder="캠페인 목적...">${c.purpose||''}</textarea></div>
    <div class="fg"><label>발송 제품</label><textarea id="f-product" placeholder="발송 제품명 및 수량...">${c.product||''}</textarea></div>
    <hr class="div">
    ${sf}
    <div class="fg">
      <label style="display:flex;align-items:center;justify-content:space-between">
        <span>🔗 링크</span>
        <button type="button" onclick="addUrlRow()" class="btn" style="font-size:11px;padding:3px 10px">+ 추가</button>
      </label>
      <div id="url-rows"></div>
    </div>
    ${isR?`<div class="fg"><label>📄 Report URL</label><input type="url" id="f-reportUrl" value="${c.reportUrl||''}" placeholder="https://..."></div>`:''}
    <div class="fg"><label>메모</label><input type="text" id="f-memo" value="${c.memo||''}" placeholder="기타 메모..."></div>`;
}

function openModal(ch,idx=null){
  editCh=ch; editIdx=idx;
  const c=idx!==null?(data[ch][idx]||{}):{};
  document.getElementById('modal-ttl').textContent = idx!==null?'캠페인 수정':CH_INFO[ch].name+' — 캠페인 추가';
  document.getElementById('modal-body').innerHTML = getFields(ch,c);
  document.getElementById('overlay').classList.add('open');
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      initDatePicker('f-start', c.start||'', v=>{ dpState['f-start'].value=v; });
      initDatePicker('f-end', c.end||'', v=>{ dpState['f-end'].value=v; });
      // URL rows 초기화
      const urls = c.urls && c.urls.length ? c.urls : (c.folderUrl ? [{label:'폴더',url:c.folderUrl}] : [{label:'',url:''}]);
      const container = document.getElementById('url-rows');
      if(container){ container.innerHTML=''; urls.forEach((u,i)=>addUrlRow(u.label,u.url)); }
    });
  });
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  editCh=null; editIdx=null;
}

async function saveCampaign(){
  const ch=editCh;
  // 일반 input
  const g=id=>{
    if(id==='f-start'||id==='f-end') return dpState[id]?.value||'';
    const el=document.getElementById(id); return el?el.value.trim():'';
  };
  const gn=id=>{const el=document.getElementById(id);return el?(parseInt(el.value)||0):0;};
  const c={
    name:g('f-name'), branch:g('f-branch'),
    start:g('f-start'), end:g('f-end'),
    purpose:g('f-purpose'), product:g('f-product'),
    applicants:gn('f-applicants'), completed:gn('f-completed'),
    submitted:gn('f-submitted'), dropped:gn('f-dropped'), paid:gn('f-paid'),
    reportUrl:g('f-reportUrl'), urls:getUrlRows(), memo:g('f-memo')
  };
  if(!c.name){alert('캠페인명을 입력해주세요.');return;}
  if(editIdx!==null) data[ch][editIdx]=c;
  else data[ch].push(c);
  closeModal();
  renderList(ch);
  renderDash();
  renderOvCal();
  await saveData();
}

function delCamp(ch,idx){
  if(!confirm('삭제할까요?')) return;
  data[ch].splice(idx,1);
  saveData(); renderList(ch); renderDash();
}

document.getElementById('overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('overlay')) closeModal();
});

// --- INIT ---
loadData().then(()=>{
  renderDash();
  renderOvCal();
}).catch(e=>{
  console.error(e);
  renderDash();
  renderOvCal();
});
</script>
</body>
</html>
